name: Checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check cli.mjs
      - run: npm pack --dry-run
