name: PR guardrails
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
# Serialise report writers; every run reads current base/head SHAs, not event SHAs.
concurrency:
  group: pr-guardrails
  cancel-in-progress: false
jobs:
  report:
    name: Refresh PR guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted default-branch code runs with a write token. PR blobs are data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tokenizer
        run: python -m pip install -r .github/guardrails-requirements.txt
      - name: Refresh native checks and one PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_guardrails.py --github --cli-version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-guardrails-${{ github.run_id }}
          path: pr-guardrails.json
          if-no-files-found: ignore
